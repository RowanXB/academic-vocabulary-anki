{{#Productive}}
<main class="sheet answer" id="answer">
  <div class="eyebrow">Answer</div>
  <div class="term">{{Answer}}</div>
  <div class="lemma"><span class="label" style="display: inline; margin-right: 6px;">Base form</span><span class="term" style="font-size: 24px;">{{Term}}</span></div>
  {{#IPA}}<div class="ipa">{{IPA}}</div>{{/IPA}}
  <div class="context">{{Context}}</div>
  {{#Collocation}}<div class="detail"><span class="label">Collocation</span>{{Collocation}}</div>{{/Collocation}}
  <div class="audio">{{tts en_US voices=Apple_Samantha,Microsoft_Zira,Microsoft_David:Answer}}</div>
</main>
{{/Productive}}
